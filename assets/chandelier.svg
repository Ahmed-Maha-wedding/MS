<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <g fill="none" stroke="#2C3E60" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Canopy / Ceiling Mount -->
    <path d="M 80,10 Q 120,5 160,10" />
    <path d="M 95,15 Q 120,10 145,15" />
    <path d="M 120,15 L 120,40" stroke-width="1.8" />
    <!-- Chain Links -->
    <circle cx="120" cy="22" r="3" />
    <circle cx="120" cy="32" r="3" />
    
    <!-- Top Swag Curtain / Drapery Lines (from top right/left) -->
    <path d="M 0,15 Q 60,35 120,40 Q 180,35 240,15" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
    <path d="M 0,28 Q 60,48 120,42 Q 180,48 240,28" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />

    <!-- Upper Chandelier Bowl -->
    <path d="M 105,42 Q 120,48 135,42 L 132,55 Q 120,60 108,55 Z" fill="#F8FAFC" />
    
    <!-- Tier 1 Crystal Strands -->
    <path d="M 85,75 Q 120,95 155,75" />
    <path d="M 75,90 Q 120,115 165,90" />
    
    <!-- Chandelier Arms with Candle Lights -->
    <!-- Center Column -->
    <path d="M 120,55 L 120,140" stroke-width="2" />
    
    <!-- Left Arm 1 -->
    <path d="M 120,95 C 90,95 65,115 65,135 C 65,145 75,150 82,145" />
    <path d="M 65,130 L 65,120" stroke-width="2" />
    <ellipse cx="65" cy="115" rx="3" ry="5" fill="#E2E8F0" />
    
    <!-- Right Arm 1 -->
    <path d="M 120,95 C 150,95 175,115 175,135 C 175,145 165,150 158,145" />
    <path d="M 175,130 L 175,120" stroke-width="2" />
    <ellipse cx="175" cy="115" rx="3" ry="5" fill="#E2E8F0" />

    <!-- Left Outer Arm -->
    <path d="M 120,115 C 75,115 40,145 40,170 C 40,185 55,190 65,182" />
    <path d="M 40,165 L 40,152" stroke-width="2" />
    <ellipse cx="40" cy="147" rx="3" ry="5" fill="#E2E8F0" />

    <!-- Right Outer Arm -->
    <path d="M 120,115 C 165,115 200,145 200,170 C 200,185 185,190 175,182" />
    <path d="M 200,165 L 200,152" stroke-width="2" />
    <ellipse cx="200" cy="147" rx="3" ry="5" fill="#E2E8F0" />

    <!-- Center Main Crystal Basket (Detailed Facets) -->
    <path d="M 65,145 Q 120,195 175,145" stroke-width="1.6" />
    <path d="M 72,155 Q 120,205 168,155" />
    <path d="M 80,165 Q 120,215 160,165" />
    <path d="M 90,175 Q 120,225 150,175" />
    <path d="M 102,185 Q 120,232 138,185" />
    
    <!-- Vertical Crystal Garland Connectors -->
    <path d="M 80,148 L 95,200" stroke-dasharray="1 3" />
    <path d="M 95,152 L 105,210" stroke-dasharray="1 3" />
    <path d="M 120,155 L 120,230" stroke-dasharray="1 3" />
    <path d="M 145,152 L 135,210" stroke-dasharray="1 3" />
    <path d="M 160,148 L 145,200" stroke-dasharray="1 3" />

    <!-- Bottom Pendant Finial Crystal -->
    <path d="M 115,235 L 120,255 L 125,235 Z" fill="#CBD5E1" stroke-width="1" />
    <circle cx="120" cy="262" r="2.5" fill="#94A3B8" />

    <!-- Hanging Tear Drops on Arms -->
    <path d="M 40,175 L 40,190 L 42,190 L 40,198 L 38,190 Z" fill="#CBD5E1" />
    <path d="M 65,150 L 65,165 L 67,165 L 65,173 L 63,165 Z" fill="#CBD5E1" />
    <path d="M 175,150 L 175,165 L 177,165 L 175,173 L 173,165 Z" fill="#CBD5E1" />
    <path d="M 200,175 L 200,190 L 202,190 L 200,198 L 198,190 Z" fill="#CBD5E1" />
