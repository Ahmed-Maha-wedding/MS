<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Paper Canvas Texture Filter -->
    <filter id="embossRelief" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur" />
      <feOffset in="blur" dx="-1.5" dy="-1.5" result="offsetHighlight" />
      <feOffset in="blur" dx="2" dy="2.5" result="offsetShadow" />
      <feFlood flood-color="#E5C78E" flood-opacity="0.32" result="highlightColor" />
      <feFlood flood-color="#020611" flood-opacity="0.85" result="shadowColor" />
      <feComposite in="highlightColor" in2="offsetHighlight" operator="in" result="highlight" />
      <feComposite in="shadowColor" in2="offsetShadow" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="highlight" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linen Canvas Pattern -->
    <pattern id="linenWeave" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M 0,2 L 4,2 M 2,0 L 2,4" stroke="#000000" stroke-width="0.5" stroke-opacity="0.18" />
      <path d="M 0,0 L 4,0 M 0,4 L 4,4" stroke="#DFBA73" stroke-width="0.4" stroke-opacity="0.08" />
    </pattern>

    <!-- Petal Gradient -->
    <linearGradient id="petalNavyGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#14284d" />
      <stop offset="50%" stop-color="#0c1d3c" />
      <stop offset="100%" stop-color="#071329" />
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafNavyGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#182f57" />
      <stop offset="60%" stop-color="#0e2040" />
      <stop offset="100%" stop-color="#061226" />
    </linearGradient>

    <!-- Vein Stroke Gradient -->
    <linearGradient id="veinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0BF7E" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Deep Navy Base Paper -->
  <rect width="100%" height="100%" fill="#091834" />
  <rect width="100%" height="100%" fill="url(#linenWeave)" />

  <g filter="url(#embossRelief)">
    <!-- ==================== LARGE PEONY 1 (Top Left) ==================== -->
    <g transform="translate(110, 115) scale(0.95)">
      <!-- Outer Ruffled Petals -->
      <path d="M -70,-30 C -85,-10 -80,25 -55,50 C -30,75 15,80 45,65 C 75,50 85,15 75,-20 C 65,-55 20,-75 -20,-70 C -50,-65 -60,-45 -70,-30 Z" fill="url(#petalNavyGrad)" stroke="#E5C78E" stroke-width="0.8" stroke-opacity="0.25" />
      <path d="M -50,-65 C -25,-85 20,-85 50,-60 C 80,-35 85,5 70,40 C 55,75 10,85 -25,75 C -60,65 -80,30 -75,-10 C -70,-45 -55,-60 -50,-65 Z" fill="url(#petalNavyGrad)" stroke="#E5C78E" stroke-width="0.7" stroke-opacity="0.22" />
      
      <!-- Tier 2 Petals (Layered Scallops) -->
      <path d="M -45,-35 C -55,-15 -50,15 -35,35 C -20,55 10,60 30,50 C 50,40 60,15 50,-10 C 40,-35 15,-50 -15,-48 C -35,-45 -40,-30 -45,-35 Z" fill="url(#petalNavyGrad)" stroke="#E5C78E" stroke-width="0.9" stroke-opacity="0.3" />
      <path d="M -30,-45 C -5,-55 25,-50 40,-30 C 55,-10 50,20 35,40 C 20,60 -10,60 -30,45 C -50,30 -50,0 -40,-25 C -35,-40 -25,-45 -30,-45 Z" fill="url(#petalNavyGrad)" stroke="#E5C78E" stroke-width="0.8" stroke-opacity="0.32" />

      <!-- Tier 3 Intermediate Petal Flakes -->
      <path d="M -25,-25 C -35,-10 -30,10 -15,22 C 0,35 20,30 30,18 C 40,5 35,-15 20,-28 C 5,-40 -15,-35 -25,-25 Z" fill="url(#petalNavyGrad)" stroke="#E5C78E" stroke-width="1.1" stroke-opacity="0.38" />
      <path d="M -15,-30 C 5,-38 25,-25 30,-8 C 35,10 20,25 5,30 C -10,35 -25,25 -28,10 C -30,-5 -25,-25 -15,-30 Z" fill="url(#petalNavyGrad)" stroke="#E5C78E" stroke-width="1.1" stroke-opacity="0.4" />

      <!-- Center Ruffled Heart / Peony Core -->
      <path d="M -12,-15 C -20,-5 -15,10 -5,15 C 5,20 18,15 20,5 C 22,-5 15,-18 5,-20 C -5,-22 -10,-18 -12,-15 Z" fill="#08142b" stroke="#E5C78E" stroke-width="1.3" stroke-opacity="0.5" />
      <path d="M -6,-10 C -12,0 -8,8 0,10 C 8,12 14,6 12,0 C 10,-6 4,-12 -2,-12 C -5,-12 -6,-8 -6,-10 Z" fill="#050e1f" stroke="#E5C78E" stroke-width="1.4" stroke-opacity="0.6" />
      <circle cx="1" cy="-1" r="3" fill="#DFBA73" fill-opacity="0.45" />
    </g>

    <!-- ==================== LARGE PEONY 2 (Bottom Right) ==================== -->
    <g transform="translate(315, 305) scale(1.05)">
      <!-- Outer Ruffled Petals -->
      <path d="M -75,-25 C -88,-5 -82,30 -58,55 C -32,80 18,82 48,68 C 78,52 88,18 78,-18 C 68,-52 22,-78 -18,-72 C -48,-68 -65,-42 -75,-25 Z" fill="url(#petalNavyGrad)" stroke="#E5C78E" stroke-width="0.8" stroke-opacity="0.25" />
      <!-- Inner Layers -->
      <path d="M -48,-38 C -60,-18 -52,18 -38,38 C -22,58 12,62 32,52 C 52,42 62,18 52,-8 C 42,-32 18,-52 -12,-50 C -32,-48 -42,-32 -48,-38 Z" fill="url(#petalNavyGrad)" stroke="#E5C78E" stroke-width="0.9" stroke-opacity="0.32" />
      <path d="M -28,-28 C -38,-12 -32,12 -18,24 C 2,36 22,32 32,20 C 42,6 38,-14 22,-28 C 6,-42 -14,-38 -28,-28 Z" fill="url(#petalNavyGrad)" stroke="#E5C78E" stroke-width="1.1" stroke-opacity="0.4" />
      <!-- Core -->
      <path d="M -10,-12 C -18,-2 -12,10 -2,14 C 8,18 18,12 18,2 C 18,-8 10,-18 0,-18 C -7,-18 -9,-14 -10,-12 Z" fill="#071226" stroke="#E5C78E" stroke-width="1.3" stroke-opacity="0.55" />
    </g>

    <!-- ==================== PEONY BUD & SMALL BLOSSOMS ==================== -->
    <!-- Top Right Bud -->
    <g transform="translate(320, 90) rotate(25)">
      <path d="M -25,25 C -35,5 -30,-20 -15,-32 C 0,-45 25,-40 32,-20 C 40,0 30,25 15,35 C -5,45 -20,35 -25,25 Z" fill="url(#petalNavyGrad)" stroke="#E5C78E" stroke-width="0.9" stroke-opacity="0.3" />
      <path d="M -15,15 C -22,0 -18,-15 -8,-22 C 2,-30 18,-25 22,-12 C 28,0 20,18 10,24 C -2,30 -12,22 -15,15 Z" fill="url(#petalNavyGrad)" stroke="#E5C78E" stroke-width="1.1" stroke-opacity="0.45" />
      <!-- Calyx Leaf Wrap -->
      <path d="M -28,28 C -35,38 -45,40 -50,42 C -42,32 -38,20 -30,12" stroke="#E5C78E" stroke-width="1.2" stroke-opacity="0.4" fill="none" />
      <path d="M 22,28 C 30,38 42,42 48,44 C 38,34 32,22 25,14" stroke="#E5C78E" stroke-width="1.2" stroke-opacity="0.4" fill="none" />
    </g>

    <!-- Bottom Left Bud -->
    <g transform="translate(70, 310) rotate(-40)">
      <path d="M -22,20 C -30,5 -25,-15 -12,-25 C 0,-35 20,-30 26,-15 C 32,0 24,20 12,28 C -2,35 -16,28 -22,20 Z" fill="url(#petalNavyGrad)" stroke="#E5C78E" stroke-width="0.9" stroke-opacity="0.3" />
      <path d="M -12,10 C -18,-2 -14,-12 -6,-18 C 2,-24 14,-20 18,-10 C 22,0 16,14 8,18 C -2,22 -10,16 -12,10 Z" fill="url(#petalNavyGrad)" stroke="#E5C78E" stroke-width="1.1" stroke-opacity="0.4" />
    </g>

    <!-- ==================== LUSH BOTANICAL LEAF SPRAYS & STEMS ==================== -->
    <!-- Connecting Botanical Stems -->
    <path d="M 170,160 Q 240,210 270,250" stroke="url(#veinGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 200,100 Q 250,90 280,95" stroke="url(#veinGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M 90,190 Q 75,230 70,270" stroke="url(#veinGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <!-- Leaf 1 (Top Center Spray) -->
    <g transform="translate(225, 60) rotate(15)">
      <path d="M 0,40 C -18,25 -25,-5 0,-30 C 25,-5 18,25 0,40 Z" fill="url(#leafNavyGrad)" stroke="#E5C78E" stroke-width="1" stroke-opacity="0.35" />
      <path d="M 0,38 L 0,-26 M 0,20 L -12,8 M 0,8 L 12,-4 M 0,-4 L -10,-16 M 0,-14 L 8,-22" stroke="url(#veinGrad)" stroke-width="0.9" stroke-linecap="round" fill="none" />
    </g>

    <!-- Leaf 2 (Mid Center Diagonal) -->
    <g transform="translate(220, 200) rotate(-45)">
      <path d="M 0,55 C -24,35 -30,-10 0,-45 C 30,-10 24,35 0,55 Z" fill="url(#leafNavyGrad)" stroke="#E5C78E" stroke-width="1.1" stroke-opacity="0.38" />
      <path d="M 0,50 L 0,-40 M 0,30 L -16,14 M 0,12 L 16,-4 M 0,-6 L -14,-22 M 0,-20 L 10,-32" stroke="url(#veinGrad)" stroke-width="1" stroke-linecap="round" fill="none" />
    </g>

    <!-- Leaf 3 (Left Outer Edge) -->
    <g transform="translate(25, 120) rotate(-75)">
      <path d="M 0,45 C -20,28 -25,-8 0,-35 C 25,-8 20,28 0,45 Z" fill="url(#leafNavyGrad)" stroke="#E5C78E" stroke-width="1" stroke-opacity="0.32" />
      <path d="M 0,40 L 0,-30 M 0,22 L -14,10 M 0,8 L 14,-4" stroke="url(#veinGrad)" stroke-width="0.8" stroke-linecap="round" fill="none" />
    </g>

    <!-- Leaf 4 (Bottom Left Spray) -->
    <g transform="translate(140, 310) rotate(60)">
      <path d="M 0,48 C -22,30 -26,-6 0,-38 C 26,-6 22,30 0,48 Z" fill="url(#leafNavyGrad)" stroke="#E5C78E" stroke-width="1.1" stroke-opacity="0.35" />
      <path d="M 0,44 L 0,-32 M 0,24 L -15,10 M 0,8 L 15,-6" stroke="url(#veinGrad)" stroke-width="0.9" stroke-linecap="round" fill="none" />
    </g>

    <!-- Leaf 5 (Bottom Right Edge) -->
    <g transform="translate(380, 240) rotate(-25)">
      <path d="M 0,42 C -18,25 -22,-5 0,-30 C 22,-5 18,25 0,42 Z" fill="url(#leafNavyGrad)" stroke="#E5C78E" stroke-width="1" stroke-opacity="0.3" />
      <path d="M 0,38 L 0,-26 M 0,18 L -12,6 M 0,6 L 12,-6" stroke="url(#veinGrad)" stroke-width="0.8" stroke-linecap="round" fill="none" />
    </g>

    <!-- Leaf 6 (Top Edge Seamless Wrap) -->
    <g transform="translate(100, 5) rotate(110)">
      <path d="M 0,38 C -16,22 -20,-5 0,-28 C 20,-5 16,22 0,38 Z" fill="url(#leafNavyGrad)" stroke="#E5C78E" stroke-width="0.9" stroke-opacity="0.3" />
    </g>
  </g>
</svg>