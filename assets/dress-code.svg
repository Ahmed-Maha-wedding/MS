<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="100%" height="100%">
  <g fill="none" stroke="#1E293B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- ==================== LADY'S EVENING GOWN (Left) ==================== -->
    <g transform="translate(45, 15)">
      <!-- Neckline / Straps -->
      <path d="M 12,5 Q 25,18 38,5" />
      <path d="M 10,5 L 14,28" />
      <path d="M 40,5 L 36,28" />
      <!-- Sweetheart Bustier -->
      <path d="M 14,28 Q 25,36 36,28" />
      <!-- Fitted Waist -->
      <path d="M 14,28 L 17,45 Q 25,48 33,45 L 36,28" fill="#F8FAFC" />
      <!-- Flowing A-Line / Ballgown Skirt -->
      <path d="M 17,45 C 10,75 -5,105 -15,115 Q 25,120 65,115 C 55,105 40,75 33,45" fill="#FFFFFF" />
      <!-- Skirt Drapes / Folds -->
      <path d="M 20,50 Q 15,85 5,116" stroke-width="0.8" opacity="0.6" />
      <path d="M 25,50 Q 25,85 25,118" stroke-width="0.8" opacity="0.6" />
      <path d="M 30,50 Q 35,85 45,116" stroke-width="0.8" opacity="0.6" />
      <!-- Hanger / Hook at Top -->
      <path d="M 25,5 Q 25,-4 22,-8 C 18,-8 18,-3 22,0" stroke-width="1" />
    </g>

    <!-- ==================== GENTLEMAN'S TUXEDO (Right) ==================== -->
    <g transform="translate(115, 15)">
      <!-- Collar & Lapels -->
      <!-- Bow Tie -->
      <polygon points="40,24 30,19 30,29" fill="#0F172A" />
      <polygon points="40,24 50,19 50,29" fill="#0F172A" />
      <circle cx="40" cy="24" r="2.5" fill="#0F172A" />
      
      <!-- Shirt Collar -->
      <path d="M 32,18 L 40,22 L 48,18" />
      <path d="M 36,24 L 36,65 L 44,65 L 44,24" fill="#FFFFFF" />
      <circle cx="40" cy="38" r="1" fill="#0F172A" />
      <circle cx="40" cy="50" r="1" fill="#0F172A" />

      <!-- Tuxedo Jacket Lapels (Satin Shawl / Peak Lapel) -->
      <path d="M 25,22 L 34,48 L 40,65 L 46,48 L 55,22" stroke-width="1.8" />
      
      <!-- Jacket Body -->
      <path d="M 25,22 L 15,35 L 18,95 L 40,95 L 62,95 L 65,35 L 55,22" fill="#F8FAFC" />
      <!-- Jacket Button at Waist -->
      <circle cx="40" cy="68" r="2" fill="#0F172A" />
      
      <!-- Pocket Square (Left Breast) -->
      <line x1="22" y1="42" x2="30" y2="42" stroke-width="1.5" />
      <path d="M 24,42 L 27,38 L 29,42" fill="#FFFFFF" />

      <!-- Hanger at Top -->
      <path d="M 40,5 Q 40,-4 37,-8 C 33,-8 33,-3 37,0" stroke-width="1" />
      <path d="M 18,22 Q 40,15 62,22" stroke-width="1" />
    </g>
  </g>
</svg>